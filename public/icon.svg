<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1120"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="brandGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="50%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background rounded rect -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)"/>
  
  <!-- Subtle border -->
  <rect width="510" height="510" x="1" y="1" rx="127" fill="none" stroke="#334155" stroke-width="2" stroke-opacity="0.4"/>

  <!-- Glowing outer ring -->
  <circle cx="256" cy="256" r="190" fill="none" stroke="url(#glowGrad)" stroke-width="24" filter="url(#glow)"/>

  <!-- Inner circular track -->
  <circle cx="256" cy="256" r="170" fill="#0f172a" stroke="#1e293b" stroke-width="4"/>

  <!-- Dynamic Flow Arc -->
  <path d="M 120 256 A 136 136 0 1 1 380 320" fill="none" stroke="url(#brandGrad)" stroke-width="16" stroke-linecap="round"/>

  <!-- Arrowhead indicating upward flow -->
  <polygon points="380,300 405,335 365,340" fill="#06b6d4"/>

  <!-- Rupee Symbol in Center -->
  <g fill="url(#brandGrad)">
    <!-- Top bar -->
    <rect x="186" y="156" width="140" height="22" rx="11"/>
    <!-- Second bar -->
    <rect x="186" y="196" width="140" height="22" rx="11"/>
    <!-- Spine -->
    <rect x="216" y="156" width="24" height="200" rx="10"/>
    <!-- Curved loop -->
    <path d="M 216 196 C 290 196, 310 240, 275 272 C 255 290, 230 292, 216 292" fill="none" stroke="url(#brandGrad)" stroke-width="22" stroke-linecap="round"/>
    <!-- Diagonal leg -->
    <line x1="240" y1="285" x2="310" y2="365" stroke="url(#brandGrad)" stroke-width="24" stroke-linecap="round"/>
  </g>

  <!-- Subtle pulse dot (automation active) -->
  <circle cx="370" cy="156" r="12" fill="#10b981" filter="url(#glow)"/>
</svg>
